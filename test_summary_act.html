<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Тест Сводного Акта</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; max-width: 800px; margin: 0 auto; }
        .btn-export-xls { padding: 8px 14px; background: #14b8a6; color: white; border: none; border-radius: 4px; cursor: pointer; }
        .summary-act-menu { position: absolute; background: white; border: 1px solid #ccc; border-radius: 4px; box-shadow: 0 2px 8px rgba(0,0,0,0.15); z-index: 1000; min-width: 180px; }
        .summary-act-menu.hidden { display: none; }
        .summary-act-option { display: block; width: 100%; padding: 10px 14px; border: none; background: none; text-align: left; cursor: pointer; }
        .summary-act-option:hover { background: #f5f5f5; }
    </style>
</head>
<body>
    <h1>Тест Сводного Акта Передачи</h1>
    
    <div style="position: relative; display: inline-block; margin: 20px 0;">
        <button id="exportXlsBtn" class="btn-export-xls">📥 Сохранить в XLS</button>
        <div id="summaryActMenu" class="summary-act-menu hidden">
            <button type="button" id="summaryActOption" class="summary-act-option">Сводный Акт передачи</button>
        </div>
    </div>

    <div>
        <input type="checkbox" class="row-checkbox" data-writeoff-id="1"> Строка 1<br>
        <input type="checkbox" class="row-checkbox" data-writeoff-id="2"> Строка 2<br>
        <input type="checkbox" class="row-checkbox" data-writeoff-id="3"> Строка 3<br>
    </div>

    <div id="results" style="margin-top: 20px; padding: 10px; background: #f5f5f5; border-radius: 4px;"></div>

    <script>
        // Тестовые данные
        window.db = {
            writeoffs: [
                { id: 1, systemId: 'DOC001', productName: 'Тестовое изделие 1', date: '2026-09-01', qty: 2, price: 1000 },
                { id: 2, systemId: 'DOC001', productName: 'Тестовое изделие 2', date: '2026-09-02', qty: 1, price: 1500 },
                { id: 3, systemId: 'DOC002', productName: 'Тестовое изделие 3', date: '2026-09-03', qty: 3, price: 800 }
            ],
            products: []
        };

        function log(msg) {
            document.getElementById('results').innerHTML += `<p>${msg}</p>`;
        }

        // Настройка обработчиков
        document.getElementById('exportXlsBtn').addEventListener('click', (e) => {
            e.stopPropagation();
            const menu = document.getElementById('summaryActMenu');
            menu.classList.toggle('hidden');
            log('Меню открыто/закрыто');
        });

        document.getElementById('summaryActOption').addEventListener('click', (e) => {
            e.stopPropagation();
            log('Вызов экспорта сводного акта');
            document.getElementById('summaryActMenu').classList.add('hidden');
        });

        document.addEventListener('click', () => {
            document.getElementById('summaryActMenu').classList.add('hidden');
        });

        log('Тест готов к использованию');
    </script>
</body>
</html>
